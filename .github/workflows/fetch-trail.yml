name: fetch-israel-national-trail
on: push
permissions:
  contents: write
jobs:
  fetch:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query OpenStreetMap (Overpass) for the Israel National Trail
        run: |
          mkdir -p data
          Q='[out:json][timeout:240];
          (rel["route"="hiking"]["name:en"~"Israel National Trail",i];rel["route"="hiking"]["name"~"^שביל ישראל"];)->.top;
          (rel(r.top);)->.sub;
          (.top;.sub;)->.rels;
          .rels out body;
          way(r.rels);
          out geom qt;'
          for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            if curl -sS --fail --max-time 300 --data-urlencode "data=$Q" "$u" -o data/int.json; then
              python3 -c "import json;d=json.load(open('data/int.json'));print(len(d['elements']))" && break
            fi
          done
          ls -la data
      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git commit -m "Trail data from OpenStreetMap [skip ci]" || echo nothing
          git push
